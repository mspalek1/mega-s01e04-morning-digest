name: Publish digest preview

on:
  workflow_dispatch:
    inputs:
      preview_mode:
        description: Choose the reviewed marker copy or the cleanup copy.
        required: true
        default: marked
        type: choice
        options:
          - marked
          - clean
      confirm_publication:
        description: Set true only after the human has approved this public deployment.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: inputs.confirm_publication == true && github.actor == 'mspalek1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies without running package scripts
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Export the marked digest
        if: inputs.preview_mode == 'marked'
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          pnpm preview:export "$RUNNER_TEMP/pages/index.html"

      - name: Export the marker-free digest
        if: inputs.preview_mode == 'clean'
        env:
          LANE_MARKER: ""
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          pnpm preview:export --allow-no-marker "$RUNNER_TEMP/pages/index.html"

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the one-page site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
